server {
    listen 2020;
    root ./www;
    err 404 ./www/404.html;

    location / {
        root ./www;
        allowed_methods GET DELETE;
    }

    location /upload {
        root ./uploads;
        allowed_methods GET POST DELETE;
    }

    location /cgi {
        root ./www/cgi;
        autoindex on;
        allowed_methods GET;
    }

    location /redirect {
        return 301 /;
    }
}

server ze {
    listen 8080;
    root ./www;
    err 404 ./www/404.html;

    location / {
        root ./www;
        allowed_methods GET DELETE;
    }

    location /upload {
        root ./uploads;
        allowed_methods GET POST DELETE;
    }

    location /redirect {
        return 301 /;
    }
}

server youpi{
    listen 4040;
    root ./www;

    location / {
        root ./www;
        allowed_methods GET;
    }

    location *.bla {
        root ./YoupiBanane;
        allowed_methods POST;
        cgi_path ./cgi_test;
    }

    location /post_body {
        root ./uploads;
        upload_dir ./uploads;
        allowed_methods POST;
        maxBody 100;
    }

    location /directory/ {
        root ./YoupiBanane;
        allowed_methods GET;
        index youpi.bad_extension;
    }
}
