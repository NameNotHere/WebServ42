server {
    listen 2020;
    root ./www;
    err 404 ./www/404.html;

    location / {
        root ./www;
        allowed_methods GET DELETE;
    }

    location /upload {
        root ./uploads;
        allowed_methods POST;
    }

    location /cgi {
        root ./www/cgi;
        autoindex on;
        allowed_methods GET;
    }

    location /redirect {
        return 301 /;
    }
}

server ze {
    listen 8080;
    root ./www;
    err 404 ./www/404.html;

    location / {
        root ./www;
        allowed_methods GET DELETE;
    }
   location /upload {
        root ./uploads;
        allowed_methods POST;
    }
}
