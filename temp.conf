server {
    listen 8080;
    root ./www;

    location / {
        root ./www;
        allowed_methods GET;
    }

    location *.bla {
        root ./YoupiBanane;
        allowed_methods POST;
        cgi_path ./cgi_test;
    }

    location /post_body {
        root ./uploads;
        upload_dir ./uploads;
        allowed_methods POST;
        maxBody 100;
    }

    location /directory/ {
        root ./YoupiBanane;
        allowed_methods GET;
        index youpi.bad_extension;
    }
}

