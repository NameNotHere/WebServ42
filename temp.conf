server {
    listen 2020;
    root /home/slimedawg/webserv/www;

    location / {
        root /home/slimedawg/webserv/www;
        allowed_methods GET;
    }

    location *.bla {
        root /home/slimedawg/webserv/YoupiBanane;
        allowed_methods POST;
        cgi_path /home/slimedawg/webserv/cgi_test;
    }

    location /post_body {
        root /home/slimedawg/webserv/uploads;
        upload_dir /home/slimedawg/webserv/uploads;
        allowed_methods POST;
        maxBody 100;
    }

    location /directory/ {
        root /home/slimedawg/webserv/YoupiBanane;
        allowed_methods GET;
        index youpi.bad_extension;
    }
}
